<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Facebook Link Collector | dev-nminhh</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root {
            --fb-blue: #1877f2;
            --fb-bg: #f0f2f5;
            --text-main: #1c1e21;
            --text-sub: #606770;
            --error: #fa3e3e;
            --success: #42b72a;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Helvetica, Arial, sans-serif; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; background-color: var(--fb-bg); margin: 0; 
        }

        .card { 
            background: white; padding: 30px; border-radius: 12px; 
            box-shadow: 0 12px 28px rgba(0,0,0,0.1); max-width: 450px; width: 90%; text-align: center;
        }

        h2 { color: var(--fb-blue); margin: 0 0 10px 0; font-size: 28px; font-weight: 800; }
        p { color: var(--text-sub); font-size: 14px; margin-bottom: 20px; }

        input { 
            padding: 12px; border: 1px solid #dddfe2; border-radius: 8px; 
            width: 100%; box-sizing: border-box; font-size: 16px; outline: none; margin-bottom: 15px;
        }

        button { 
            padding: 12px; background: var(--fb-blue); color: white; border: none; 
            border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; 
        }

        /* --- LOG CONSOLE STYLE --- */
        .log-container {
            margin-top: 20px;
            background: #1c1e21;
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            height: 120px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            border: 1px solid #333;
        }

        .log-entry {
            margin-bottom: 5px;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 2px;
            word-break: break-all;
        }

        .log-time { color: #888; margin-right: 5px; }
        .log-msg-success { color: #42b72a; }
        .log-msg-error { color: #fa3e3e; }
        .log-msg-info { color: #5bc0de; }

        #status { margin-top: 15px; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .dot { height: 8px; width: 8px; border-radius: 50%; background-color: #ccd0d5; }
        .footer { margin-top: 20px; font-size: 11px; color: #90949c; }
    </style>
</head>
<body>

    <div class="card">
        <h2>facebook</h2>
        <p>Hệ thống mời thành viên tự động</p>
        
        <input type="text" id="fbLinkInput" placeholder="Dán link Facebook profile...">
        <button onclick="sendData()">Thêm vào nhóm</button>

        <div class="log-container" id="logConsole">
            <div class="log-entry log-msg-info">> Sẵn sàng nhận log...</div>
        </div>
        
        <div id="status">
            <div id="statusDot" class="dot"></div>
            <span id="statusLabel">Đang kết nối...</span>
        </div>
    </div>

    <div class="footer">© 2026 Developed by <b>dev-nminhh</b></div>

    <script>
        const TOPIC_SEND = "get_idfacebookabcxyz";
        const TOPIC_RES = "get_idfacebookabcxyz_res";
        
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_user_" + Math.random().toString(16).substr(2, 5));

        // Khi có tin nhắn từ Python trả về
        client.onMessageArrived = (message) => {
            addLog(message.payloadString);
        };

        client.onConnectionLost = () => {
            updateStatus("Mất kết nối", "#fa3e3e");
            setTimeout(connect, 3000);
        };

        function addLog(text) {
            const consoleObj = document.getElementById("logConsole");
            const entry = document.createElement("div");
            entry.className = "log-entry";
            
            const time = new Date().toLocaleTimeString();
            const isError = text.includes("❌");
            const colorClass = isError ? "log-msg-error" : "log-msg-success";
            
            entry.innerHTML = `<span class="log-time">[${time}]</span><span class="${colorClass}">${text}</span>`;
            consoleObj.appendChild(entry);
            consoleObj.scrollTop = consoleObj.scrollHeight; // Cuộn xuống cuối
        }

        function updateStatus(text, color) {
            document.getElementById("statusLabel").innerText = text;
            document.getElementById("statusLabel").style.color = color;
            document.getElementById("statusDot").style.backgroundColor = color;
        }

        function connect() {
            client.connect({ 
                onSuccess: () => {
                    updateStatus("Hệ thống trực tuyến", "#42b72a");
                    client.subscribe(TOPIC_RES); // Đăng ký nhận log
                },
                useSSL: true,
                onFailure: () => {
                    updateStatus("Lỗi kết nối", "#fa3e3e");
                    setTimeout(connect, 3000);
                }
            });
        }

        function sendData() {
            const input = document.getElementById("fbLinkInput");
            const val = input.value.strip ? input.value.strip() : input.value;
            
            if(!val) return alert("Vui lòng nhập link!");

            if (client.isConnected()) {
                const message = new Paho.MQTT.Message(val);
                message.destinationName = TOPIC_SEND;
                client.send(message);
                addLog("📡 Đã gửi link: " + val.substring(0, 30) + "...");
                input.value = ""; 
            } else {
                alert("Mất kết nối tới Server!");
            }
        }

        connect();
    </script>
</body>
</html>
